<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="container">
        <h1>Character and Word Counter</h1>
        <textarea id="text" placeholder="Start typing here...."></textarea>

        <div class="counter">
            <p>Characters : <span id="characters">0</span></p>
            <p>Words : <span id="words">0</span></p>
            <p>Sentences : <span id="sentences">0</span></p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
